services:
  app:
    image: ${APP_IMAGE:-ghcr.io/dolr-ai/ai-feed-recommendation-system}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: recsys-app
    environment:
      PYTHONUNBUFFERED: "1"
      INFLUENCER_FEED_CONFIG_FILE: /app/config/influencer_feed.toml
      STORAGE_NAMESPACE: ${STORAGE_NAMESPACE:-prod}
      KVROCKS_HOST: ${KVROCKS_HOST}
      KVROCKS_PORT: ${KVROCKS_PORT}
      KVROCKS_PASSWORD: ${KVROCKS_PASSWORD}
      KVROCKS_TLS_ENABLED: ${KVROCKS_TLS_ENABLED:-false}
      KVROCKS_CLUSTER_ENABLED: ${KVROCKS_CLUSTER_ENABLED:-false}
      KVROCKS_SSL_CA_CERT: ${KVROCKS_SSL_CA_CERT:-}
      KVROCKS_SSL_CLIENT_CERT: ${KVROCKS_SSL_CLIENT_CERT:-}
      KVROCKS_SSL_CLIENT_KEY: ${KVROCKS_SSL_CLIENT_KEY:-}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8443}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-yral}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_READER_USERNAME}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_READER_PASSWORD}
      CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-true}
      CLICKHOUSE_VERIFY: ${CLICKHOUSE_VERIFY:-false}
      CLICKHOUSE_CONNECT_TIMEOUT_SEC: ${CLICKHOUSE_CONNECT_TIMEOUT_SEC:-10.0}
      CLICKHOUSE_QUERY_TIMEOUT_SEC: ${CLICKHOUSE_QUERY_TIMEOUT_SEC:-30.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      FEED_SYNC_RUN_ON_STARTUP: ${FEED_SYNC_RUN_ON_STARTUP:-true}
      FEED_RECSYS_JOBS_ENABLED: ${FEED_RECSYS_JOBS_ENABLED:-true}
      FEED_RECSYS_JOB_RUN_ON_STARTUP: ${FEED_RECSYS_JOB_RUN_ON_STARTUP:-true}
      DISCOVERY_REFRESH_RUN_ON_STARTUP: ${DISCOVERY_REFRESH_RUN_ON_STARTUP:-false}
      INTERNAL_REQUEST_HMAC_SECRET: ${INTERNAL_REQUEST_HMAC_SECRET:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
      SENTRY_ENABLE_LOGS: ${SENTRY_ENABLE_LOGS:-true}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_STARTUP_TEST_MESSAGE: ${SENTRY_STARTUP_TEST_MESSAGE:-}
    ports:
      - "127.0.0.1:${HOST_APP_PORT:-8000}:8000"
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - recsys-net

networks:
  recsys-net:
    driver: bridge
